name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          # Keep this in step with .minimum_zig_version in build.zig.zon.
          version: 0.16.0

      - name: Check the formatting
        run: zig build fmt

      - name: Check the layer purity
        run: zig build purity

      - name: Run the unit tests
        run: zig build test --summary all
